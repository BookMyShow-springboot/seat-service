spring:
  application:
    name: seat-service
  datasource:
    url: jdbc:mysql://localhost:3306/bookmyshow_seat_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false

seat-service:
  lock-duration-minutes: 10
